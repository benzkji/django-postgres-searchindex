name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.9, "3.10", "3.11", "3.12", "3.13"]
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres_searchindex"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tox and any other packages
        run: pip install tox tox-gh-actions
      - name: Run Tox
        # Run tox using the version of Python in `PATH`
        # run: tox -e py${{ matrix.python }}-${{ matrix.django }}
        run: tox

  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres_searchindex"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python }}
      - name: Install flake8
        run: pip install tox
      - name: Run tox with coverage
        # Run tox using the version of Python in `PATH`
        # run: tox -e py${{ matrix.python }}-${{ matrix.django }}
        run: tox -e py12-django42-djangocms5-coverage

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.12]
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python }}
      - name: pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        # Run tox using the version of Python in `PATH`
        # run: tox -e py${{ matrix.python }}-${{ matrix.django }}
        run: pre-commit run --all-files
